<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Adventure?</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bellota+Text:ital,wght@1,300&family=Poppins:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;

            font-family: 'Poppins', sans-serif;

            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.15),
                    rgba(0, 0, 0, 0.15)
                ),
                url("https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1600&q=80");

            background-size: cover;
            background-position: center;
        }


        /* =================================
           FIRST PAGE
        ================================= */

        .container {
            width: 420px;
            min-height: 550px;

            position: absolute;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            text-align: center;

            padding: 20px;
        }


        .container h1 {
            margin-top: 10px;
            margin-bottom: 20px;

            font-family: 'Bellota Text', sans-serif;

            font-size: 42px;
            font-weight: 700;

            line-height: 1.2;

            color: #111;

            text-shadow:
                0px 3px 8px rgba(255, 255, 255, 0.8);
        }


        /* FIRST VIDEO */

        .gif {
            display: flex;

            justify-content: center;
            align-items: center;

            width: 100%;
            height: 280px;
        }


        .gifimg {
            width: 384px;
            height: 254px;

            border-radius: 16px;

            object-fit: cover;

            display: block;

            box-shadow:
                0px 10px 30px rgba(0, 0, 0, 0.25);
        }


        /* =================================
           ANSWER BUTTONS
        ================================= */

        .answer-box {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 35px;

            width: 100%;

            margin-top: 10px;
        }


        .answer {
            border: none;

            width: 110px;
            height: 52px;

            font-family: 'Poppins', sans-serif;

            font-size: 20px;
            font-weight: 600;

            border-radius: 12px;

            background: rgba(255, 255, 255, 0.55);

            backdrop-filter: blur(8px);

            border: 1px solid rgba(0, 0, 0, 0.6);

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }


        .answer:hover {
            transform: translateY(-3px);

            background: rgba(255, 255, 255, 0.8);

            box-shadow:
                0px 8px 20px rgba(0, 0, 0, 0.2);
        }


        .answer:active {
            transform: scale(0.95);
        }


        /* =================================
           SECOND PAGE
        ================================= */

        .confirmation {
            display: none;

            width: 450px;
            min-height: 550px;

            position: absolute;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            text-align: center;

            padding: 20px;
        }


        .confirmation h1 {
            margin-top: 10px;
            margin-bottom: 8px;

            font-family: 'Bellota Text', sans-serif;

            font-size: 42px;
            font-weight: 700;

            line-height: 1.2;

            color: #111;

            text-shadow:
                0px 3px 8px rgba(255, 255, 255, 0.8);
        }


        .confirmation p {
            margin-top: 5px;
            margin-bottom: 10px;

            font-size: 17px;
            font-weight: 500;

            color: #222;
        }


        /* SECOND VIDEO */

        .fix-gif {
            display: flex;

            justify-content: center;
            align-items: center;

            width: 100%;
            height: 270px;
        }


        .fix-gifimg {
            width: 384px;
            height: 216px;

            border-radius: 16px;

            object-fit: cover;

            display: block;

            box-shadow:
                0px 10px 30px rgba(0, 0, 0, 0.25);
        }


        /* FINAL BUTTON */

        #fix {
            width: 260px;
            height: 52px;

            font-size: 17px;
        }


        /* =================================
           MOBILE
        ================================= */

        @media screen and (max-width: 600px) {

            .container,
            .confirmation {
                width: 100%;

                padding: 20px;
            }


            .container h1,
            .confirmation h1 {
                font-size: 34px;

                line-height: 1.25;

                margin-top: 10px;
                margin-bottom: 15px;
            }


            /* First video */

            .gif {
                height: 240px;
            }


            .gifimg {
                width: 300px;
                height: 198px;

                border-radius: 14px;
            }


            /* Buttons */

            .answer-box {
                gap: 25px;
            }


            .answer {
                width: 100px;
                height: 48px;

                font-size: 18px;
            }


            /* Second page */

            .confirmation p {
                font-size: 15px;
            }


            .fix-gif {
                height: 220px;
            }


            .fix-gifimg {
                width: 300px;
                height: 168px;

                border-radius: 14px;
            }


            #fix {
                width: 240px;

                font-size: 16px;
            }
        }

    </style>
</head>


<body>


    <!-- =================================
         FIRST PAGE
    ================================= -->

    <div class="container">

        <div class="question">

            <h1>
                You, me, and a little adventure.<br>
                What do you say? 👀
            </h1>

        </div>


        <!-- 1A.mp4 -->

        <div class="gif">

            <video
                class="gifimg"
                autoplay
                muted
                loop
                playsinline
                preload="auto">

                <source src="1A.mp4" type="video/mp4">

                Your browser does not support video.

            </video>

        </div>


        <!-- YES / NO -->

        <div class="answer-box">

            <button
                class="answer"
                id="yes">

                Yes

            </button>


            <button
                class="answer"
                id="no">

                No

            </button>

        </div>

    </div>



    <!-- =================================
         SECOND PAGE
    ================================= -->

    <div class="confirmation">


        <h1>
            I had a feeling<br>
            you'd say yes.
        </h1>


        <p>
            Now let's make it happen.
        </p>


        <!-- 2A.mp4 -->

        <div class="fix-gif">

            <video
                class="fix-gifimg"
                autoplay
                muted
                loop
                playsinline
                preload="auto">

                <source src="2A.mp4" type="video/mp4">

                Your browser does not support video.

            </video>

        </div>


        <!-- WHATSAPP -->

        <button
            class="answer"
            id="fix">

            Let's make it happen →

        </button>


    </div>



    <!-- =================================
         JAVASCRIPT
    ================================= -->

    <script>

        const yes =
            document.querySelector("#yes");


        const no =
            document.querySelector("#no");


        const confirmation =
            document.querySelector(".confirmation");


        const container =
            document.querySelector(".container");



        /* =================================
           YES BUTTON
        ================================= */

        yes.addEventListener("click", function () {

            container.style.display = "none";

            confirmation.style.display = "block";


            /* Start second video */

            const secondVideo =
                document.querySelector(".fix-gifimg");

            secondVideo.currentTime = 0;

            secondVideo.play();

        });



        /* =================================
           NO BUTTON
        ================================= */

        no.addEventListener("click", function () {

            no.style.position = "absolute";


            const maxX =
                container.clientWidth -
                no.offsetWidth;


            const maxY =
                container.clientHeight -
                no.offsetHeight;


            const xPosition =
                Math.floor(
                    Math.random() *
                    Math.max(maxX, 1)
                );


            const yPosition =
                Math.floor(
                    Math.random() *
                    Math.max(maxY, 1)
                );


            no.style.left =
                `${xPosition}px`;


            no.style.top =
                `${yPosition}px`;

        });



        /* =================================
           WHATSAPP BUTTON
        ================================= */

        document
            .getElementById("fix")
            .addEventListener("click", function () {


                const message =
                    "I said yes… now make me wonder why I didn’t say yes sooner. 👀";


                const whatsappURL =
                    "https://wa.me/919873010908?text=" +
                    encodeURIComponent(message);


                window.location.href =
                    whatsappURL;

            });

    </script>

</body>
</html>
