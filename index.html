<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trekking?</title>
    <link rel="stylesheet" href="style.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bellota+Text:ital,wght@1,300&family=Poppins:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Bellota Text', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100vh;
            background-image: url("https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1600&q=80");
            background-size: cover;
            background-position: center;
        }

        .confirmation {
            display: none;
            width: 400px;
            height: 500px;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .confirmation h1 {
            font-style: bolder;
            font-size: 50px;
            font-weight: 700;
            text-shadow: 0px 3px 6px rgb(147, 77, 77);
            line-height: 90px;
        }

        .fix-gif {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 200px;
        }

        .fix-gifimg {
            border-radius: 10px;
            width: 384px;
            height: 216px;

            /* Trekking / mountain visual */
            background-image: url("https://media.giphy.com/media/3o7TKsQ8UQ4G1L5p5C/giphy.gif");

            background-size: cover;
            background-position: center;
        }

        .container h1 {
            margin-bottom: 20px;
            margin-top: 50px;
            font-style: bolder;
            font-size: 50px;
            font-weight: 700;
            text-shadow: 0px 3px 6px rgb(147, 77, 77);
        }

        #fix {
            margin-top: 30px;
            border: none;
            width: 400px;
            height: 50px;
            font-size: 30px;
            border-radius: 10px;
            background: rgba(255,255,255,0.45);
            backdrop-filter: blur(5px);
            border: 1px solid black;
            font-weight: 550;
        }

        .container {
            width: 400px;
            height: 500px;
            position: absolute;
            left: 50%;
            top: 40%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .gif {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 300px;
        }

        .gifimg {
            border-radius: 10px;
            width: 384px;
            height: 254px;

            /* Trekking / hiking visual */
            background-image: url("https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif");

            background-size: cover;
            background-position: center;
        }

        .answer-box {
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            padding: 10px;
            margin-top: 5px;
            width: 100%;
            height: 80px;
            gap: 50px;
        }

        .answer {
            border: none;
            width: 100px;
            height: 50px;
            font-size: 30px;
            border-radius: 10px;
            background: rgba(255,255,255,0.45);
            backdrop-filter: blur(5px);
            border: 1px solid black;
            font-weight: 550;
        }

        .answer:hover {
            box-shadow: inset 0px 3px 6px rgba(0, 0, 0, 0.449);
        }

        @media screen and (max-width: 600px) {

            .container {
                width: 100%;
            }

            .container h1 {
                margin-top: 20px;
                padding: 8px;
                font-size: 35px;
            }

            .answer {
                font-size: 20px;
                padding: 5px;
            }

            .gifimg {
                border-radius: 10px;
                width: 300px;
                height: 198px;

                background-image: url("https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif");

                background-size: cover;
                background-position: center;
            }

            .fix-gif {
                display: flex;
                justify-content: center;
                align-items: center;
                width: 100%;
                height: 200px;
            }

            .fix-gifimg {
                border-radius: 10px;
                width: 300px;
                height: 168px;

                background-image: url("https://media.giphy.com/media/3o7TKsQ8UQ4G1L5p5C/giphy.gif");

                background-size: cover;
                background-position: center;
            }

            #fix {
                margin-top: 30px;
                border: none;
                width: 250px;
                height: 50px;
                font-size: 24px;
                border-radius: 10px;
                background: rgba(255,255,255,0.45);
                backdrop-filter: blur(5px);
                border: 1px solid black;
                font-weight: 550;
            }

            .confirmation {
                display: none;
                width: 100%;
                height: 500px;
                position: absolute;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
                text-align: center;
            }

            .confirmation h1 {
                font-size: 35px;
                padding: 8px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="question">
            <h1>
                Wanna go trekking with me? 🏔️🥾👀
            </h1>
        </div>

        <div class="gif">
            <div class="gifimg"></div>
        </div>

        <div class="answer-box">
            <button class="answer" id="yes">Yes!!!</button>
            <button class="answer" id="no">No</button>
        </div>

    </div>


    <div class="confirmation">

        <h1>
            YAYYYYY!!! My trekking partner 🏔️🥾❤️
        </h1>

        <div class="question">

            <div class="fix-gif">
                <div class="fix-gifimg"></div>
            </div>

            <button class="answer" id="fix">
                Okay, Let's Plan It 👀
            </button>

        </div>

    </div>


    <script>

        const yes = document.querySelector("#yes");
        const no = document.querySelector("#no");
        const confirmation = document.querySelector(".confirmation");
        const container = document.querySelector(".container");


        const yesAnswerMethod = () => {

            container.style.display = 'none';

            confirmation.style.display = 'block';

        };


        const noAnswerMethod = () => {

            no.style.position = 'absolute';

            const xPosition = Math.floor(
                Math.random() *
                (container.clientWidth - no.offsetWidth)
            );

            const yPosition = Math.floor(
                Math.random() *
                (container.clientHeight - no.offsetHeight)
            );

            no.style.top = `${yPosition}px`;

            no.style.left = `${xPosition}px`;

        };


        no.addEventListener('click', noAnswerMethod);

        yes.addEventListener('click', yesAnswerMethod);


        document.getElementById("fix").addEventListener("click", function () {

            window.location =
                "https://wa.me/+919873010908?text=Okayyy%20you%20said%20yes%20👀%20Now%20we%20need%20to%20plan%20our%20trekking%20adventure%20🏔️🥾😂";

        }, false);

    </script>

</body>
</html>
